<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/style.css"></head><body><main class="card"><h1>Create account</h1><form id="f"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (6+ characters)" required><input name="referralCode" placeholder="Referral code (optional)"><button class="btn">Register</button></form><p id="m"></p><a href="/login.html">Login</a></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();m.textContent=d.error||"Account created.";if(r.ok)setTimeout(()=>location="/login.html",700)}</script></body></html>
