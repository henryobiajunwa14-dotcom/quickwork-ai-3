<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="/style.css"></head><body><header><b>QuickWork AI</b><button onclick="localStorage.removeItem('token');location='/login.html'">Logout</button></header><main><div class="card"><h1 id="hello">Dashboard</h1><p>Referral code: <b id="ref"></b> · Credits: <b id="credits"></b></p></div><section><h2>Buy a service</h2><div id="products" class="grid"></div></section><section><h2>Your orders</h2><div id="orders"></div></section></main><script>const token=localStorage.token;if(!token)location="/login.html";const H={Authorization:"Bearer "+token,"Content-Type":"application/json"};async function load(){let r=await fetch("/api/me",{headers:H});if(!r.ok)return location="/login.html";let d=await r.json();hello.textContent="Hi, "+d.user.name;ref.textContent=d.user.referral_code;credits.textContent=d.user.credits;orders.innerHTML=d.orders.length?d.orders.map(o=>`<div class="order"><b>${o.product}</b><span>${o.status}</span>${o.status==="paid"?`<a href="/api/orders/${o.id}/pdf">PDF</a><a href="/api/orders/${o.id}/docx">TXT</a>`:""}</div>`).join(""):"No orders yet."}fetch("/api/products").then(r=>r.json()).then(ps=>products.innerHTML=ps.map(p=>`<article><h3>${p.name}</h3><p>${p.description}</p><b>₦${p.price.toLocaleString()}</b><br><button class="btn" onclick="buy('${p.id}')">Buy</button></article>`).join(""));async function buy(id){let input=prompt("Brief/details (optional):")||"";let r=await fetch("/api/paystack/initialize",{method:"POST",headers:H,body:JSON.stringify({productId:id,inputText:input})}),d=await r.json();if(!r.ok)return alert(d.error);location=d.authorization_url}load();</script></body></html>
