<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="card"><h1>Admin dashboard</h1><input id="key" type="password" placeholder="Admin key"><button class="btn" onclick="load()">Load stats</button><pre id="out"></pre></main><script>async function load(){let r=await fetch("/api/admin/stats",{headers:{"x-admin-key":key.value}});out.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
